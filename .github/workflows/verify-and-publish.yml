name: Verify and publish Tasktap
on:
  pull_request:
  push:
    branches: [main, 'rebuild*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: UI, behavior and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check the published guide against this change
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            python3 scripts/verify-docs.py "$(git merge-base "$PR_BASE" "$PR_HEAD")" "$PR_HEAD"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            python3 scripts/verify-docs.py "$BEFORE" HEAD
          else
            python3 scripts/verify-docs.py HEAD^ HEAD
          fi
      - name: Source and design rules
        run: |
          python3 scripts/verify-style.py
          python3 -m compileall -q scripts
          for file in prototype/*.js site/*.js scripts/*.cjs; do node --check "$file"; done
          git diff --check HEAD^ HEAD
      - name: Session, routing and model regressions
        run: |
          python3 scripts/verify-agent-models.py
          python3 scripts/verify-router-providers.py
          python3 scripts/verify-project-sessions.py
          python3 scripts/verify-session-rows.py
          python3 scripts/verify-visible-session.py
          python3 scripts/verify-workspace-terminals.py
          python3 scripts/verify-session-observer.py
          python3 scripts/verify-tasktap-shell.py
          python3 scripts/verify-terminal-replay.py
          python3 scripts/verify-release-helpers.py
          python3 scripts/verify-resource-integrity.py
          node scripts/verify-model-policy.cjs
          node scripts/verify-workspace-layout.cjs
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Build and exercise the public site and the app
        run: |
          export TASKTAP_SCREENSHOTS="$RUNNER_TEMP/tasktap-shots"
          mkdir -p "$TASKTAP_SCREENSHOTS"
          python3 scripts/build-site.py
          for test in session-attention capture-preparation activity workspace-activity notch-profile notch-glow independent-windows workspace-deck workspace-navigation workspace-lifecycle workspace-background workspace-splits workspace-drag terminal-viewport terminal-controls terminal-clipboard terminal-input terminal-protocol terminal-resize terminal-reflow workspace-documents appearance home-overview result-presentation settings-layout voice-settings review capture-context notifications pages ui relay decision-rim voice-wave setup setup-preparation first-run model-ui model-server connections session-names session-detail workspace-lists update-ui; do
            node "scripts/verify-$test.cjs"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-checks
          path: ${{ runner.temp }}/tasktap-shots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/pages

  mac:
    name: macOS build and notch geometry
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify update lifecycle guards
        run: node scripts/verify-updates.cjs
      - name: Verify installer replacement and backups
        run: bash scripts/verify-installer.sh
      - name: Build app and verify signature
        run: ./scripts/build-mac.sh
      - name: Check notch placement and restored sessions
        run: |
          swiftc native/NotchGeometry.swift scripts/verify-notch-geometry.swift -o "$RUNNER_TEMP/notch-test"
          "$RUNNER_TEMP/notch-test"
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx26.0" native/HandoffRouter.swift scripts/verify-handoff-router.swift -o "$RUNNER_TEMP/handoff-test"
          "$RUNNER_TEMP/handoff-test"
          swiftc native/TerminalInputDiagnostics.swift scripts/verify-terminal-diagnostics.swift -o "$RUNNER_TEMP/input-diagnostics-test"
          "$RUNNER_TEMP/input-diagnostics-test"
          python3 scripts/verify-visible-session.py
          swiftc native/SessionNames.swift scripts/verify-session-names.swift -o "$RUNNER_TEMP/names-test"
          "$RUNNER_TEMP/names-test"
          swiftc native/ScreenContext.swift scripts/verify-screen-context.swift -o "$RUNNER_TEMP/context-test"
          "$RUNNER_TEMP/context-test"
          swiftc -parse-as-library native/SpeechPreferences.swift native/CloudSpeech.swift native/SpeechService.swift native/Dictation.swift scripts/verify-speech.swift -o "$RUNNER_TEMP/speech-test"
          "$RUNNER_TEMP/speech-test"
          swiftc native/WorkspaceFolders.swift native/LiveWorkspace.swift native/WorkspaceTerminals.swift scripts/verify-workspace-folders.swift -o "$RUNNER_TEMP/folders-test"
          "$RUNNER_TEMP/folders-test"
          swiftc native/WorkspaceTerminals.swift native/LiveWorkspace.swift native/WorkspaceFolders.swift scripts/verify-terminal-prerequisites.swift -o "$RUNNER_TEMP/terminal-prerequisites"
          "$RUNNER_TEMP/terminal-prerequisites"
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows from day one, so nothing Unix-only slips into the protocol.
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deploy:
    name: Publish GitHub Pages
    needs: [quality, mac]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: tasktap-pages
      cancel-in-progress: false
    steps:
      - name: Deploy checked Pages artifact
        id: publish
        uses: actions/deploy-pages@v4
