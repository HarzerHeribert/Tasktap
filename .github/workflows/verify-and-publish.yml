name: Verify and publish Tasktap
on:
  pull_request:
  push:
    branches: [main, 'rebuild*']
  workflow_dispatch:

# No job reads a secret, so pull requests from forks run every check. Only the deployment
# asks for more than read access, and it never runs for a pull request.
permissions:
  contents: read

jobs:
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows from day one, so nothing Unix-only slips into the protocol.
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The core's terminals run in Microsoft's console when it lies beside the core, as in the
      # app; the test of a line typed as output ends has nothing to test without it.
      - name: Put Microsoft's console beside the core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --quiet
          ./scripts/conpty.ps1 -Target x86_64 -Into target/debug
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      # On Windows the whole suite runs as a person's Windows has it, and as the tower runs it
      # (scripts/winvm/run.ps1): in PowerShell, with no HOME, and with none of the Unix tools Git
      # brings (cp, mkfifo, sh) on the PATH. Git Bash lent the tests all three, and a test that
      # needed one passed here and failed there.
      - name: Test (Windows, without Git Bash's HOME and tools)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $unix = '\\Git\\(usr\\bin|bin|mingw64\\bin)\\?$'
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch $unix }) -join ';'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { $env:PATH += ";$env:ProgramFiles\Git\cmd" }
          $lent = @('cp', 'mkfifo', 'sh') | Where-Object { Get-Command $_ -CommandType Application -ErrorAction SilentlyContinue }
          if ($lent) { throw "Unix tools still on the PATH: $($lent -join ', ')" }
          git --version
          cargo test --workspace --no-fail-fast

  interface:
    name: Interface (types, tests, build, pages)
    runs-on: ubuntu-24.04 # held: the page checks' browser does not install on the newer image yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: No whitespace errors in this change
        run: git diff --check HEAD^ HEAD
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: ui
      - name: Types and tests
        run: npm run check
        working-directory: ui
      - name: Build the pages
        run: npm run build
        working-directory: ui
      - name: Install the headless browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: The page scripts parse
        run: for file in scripts/*.cjs; do node --check "$file"; done
      - name: Every list keeps its columns
        run: node scripts/align-check.cjs
      - name: The notch and the workspace render in every state without a page error
        run: |
          node scripts/motion-pages.cjs "$RUNNER_TEMP/pages/states"
          node scripts/instrument-shots.cjs "$RUNNER_TEMP/pages/instrument" 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-pages
          path: ${{ runner.temp }}/pages
          if-no-files-found: ignore

  host:
    name: Host on macOS (lint, release build, smoke)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
        working-directory: host
      - name: Build the app (pages, core, host)
        run: host/scripts/build.sh
      - name: Lint
        run: cargo clippy -- -D warnings
        working-directory: host
      - name: Notch geometry
        run: cargo test
        working-directory: host
      - name: The app carries its core and its identity, and seals with every program in it signed
        run: |
          app="host/target/release/bundle/macos/Tasktap.app"
          test -x "$app/Contents/MacOS/tasktap-app"
          codesign --verify --strict "$app/Contents/MacOS/tasktap"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.harzerheribert.tasktap
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = "Tasktap"
          # Sealed ad hoc as a release seals it with the Developer ID (release.yml): the hardened runtime and each
          # program's own entitlements, no program left unsigned.
          host/scripts/sign-mac.sh "$app"
      - name: Install the headless browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Smoke (the real app on the fixture agent, passive, in a temporary data folder)
        # The smoke run expects the Mac's default shell, zsh: it looks for a terminal named after it
        # and for a bracketed paste, which the system's bash does not do. The runner's account
        # uses bash, so the shell is named here, with an empty start file to keep it quiet.
        run: |
          touch "$HOME/.zshrc"
          SHELL=/bin/zsh SHOTS="$RUNNER_TEMP/smoke" host/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: host-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # The public site describes this app. What it takes from the app (site/app) is made on a Mac by
  # scripts/render-site.cjs and committed; here it is assembled and checked on every run, and
  # published from main only.
  site:
    name: Public site
    # Not ubuntu-latest: that is Ubuntu 26.04 now, for which Playwright 1.60 has no browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: The site's scripts parse
        run: for file in site/*.js site/src/*.js site/app/stage.js; do node --check "$file"; done
      - name: Build the site
        run: python3 scripts/build-site.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Exercise the built site
        run: |
          export TASKTAP_SCREENSHOTS="$RUNNER_TEMP/site-shots"
          mkdir -p "$TASKTAP_SCREENSHOTS"
          node scripts/verify-pages.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-checks
          path: ${{ runner.temp }}/site-shots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/pages

  deploy:
    name: Publish GitHub Pages
    needs: [site]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: tasktap-pages
      cancel-in-progress: false
    steps:
      - name: Deploy checked Pages artifact
        id: publish
        uses: actions/deploy-pages@v4
