name: Verify and publish Tasktap
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: UI, behavior and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check the published guide against this change
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            python3 scripts/verify-docs.py "$(git merge-base "$PR_BASE" "$PR_HEAD")" "$PR_HEAD"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            python3 scripts/verify-docs.py "$BEFORE" HEAD
          else
            python3 scripts/verify-docs.py HEAD^ HEAD
          fi
      - name: Source and design rules
        run: |
          python3 scripts/verify-style.py
          python3 -m compileall -q scripts
          for file in prototype/*.js site/*.js scripts/*.cjs; do node --check "$file"; done
          git diff --check HEAD^ HEAD
      - name: Session, routing and model regressions
        run: |
          python3 scripts/verify-session-hosts.py
          python3 scripts/verify-session-history.py
          python3 scripts/verify-session-names.py
          python3 scripts/verify-agent-models.py
          python3 scripts/verify-router-providers.py
          python3 scripts/verify-project-sessions.py
          python3 scripts/verify-session-discovery.py
          python3 scripts/verify-visible-session.py
          python3 scripts/verify-workspace-terminals.py
          node scripts/verify-model-policy.cjs
          node scripts/verify-workspace-layout.cjs
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Build and exercise the public site and the app
        run: |
          export TASKTAP_SCREENSHOTS="$RUNNER_TEMP/tasktap-shots"
          mkdir -p "$TASKTAP_SCREENSHOTS"
          python3 scripts/build-site.py
          for test in workspace-deck workspace-navigation workspace-lifecycle workspace-splits terminal-viewport workspace-documents appearance home-overview result-presentation settings-layout review capture-context notifications pages ui relay decision-rim voice-wave setup setup-preparation first-run model-ui model-server connections session-names session-detail workspace-lists update-ui; do
            node "scripts/verify-$test.cjs"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-checks
          path: ${{ runner.temp }}/tasktap-shots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/pages

  mac:
    name: macOS build and notch geometry
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify update lifecycle guards
        run: node scripts/verify-updates.cjs
      - name: Verify installer replacement and backups
        run: bash scripts/verify-installer.sh
      - name: Build app and verify signature
        run: ./scripts/build-mac.sh
      - name: Check notch placement and restored sessions
        run: |
          swiftc native/NotchGeometry.swift scripts/verify-notch-geometry.swift -o "$RUNNER_TEMP/notch-test"
          "$RUNNER_TEMP/notch-test"
          python3 scripts/verify-visible-session.py
          swiftc native/SessionNames.swift scripts/verify-session-names.swift -o "$RUNNER_TEMP/names-test"
          "$RUNNER_TEMP/names-test"
          swiftc native/ScreenContext.swift scripts/verify-screen-context.swift -o "$RUNNER_TEMP/context-test"
          "$RUNNER_TEMP/context-test"
          swiftc native/WorkspaceFolders.swift native/LiveWorkspace.swift native/WorkspaceTerminals.swift native/TerminalCatalog.swift scripts/verify-workspace-folders.swift -o "$RUNNER_TEMP/folders-test"
          "$RUNNER_TEMP/folders-test"
          swiftc native/WorkspaceTerminals.swift native/LiveWorkspace.swift native/WorkspaceFolders.swift native/TerminalCatalog.swift scripts/verify-terminal-prerequisites.swift -o "$RUNNER_TEMP/terminal-prerequisites"
          "$RUNNER_TEMP/terminal-prerequisites"
  deploy:
    name: Publish GitHub Pages
    needs: [quality, mac]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: tasktap-pages
      cancel-in-progress: false
    steps:
      - name: Deploy checked Pages artifact
        id: publish
        uses: actions/deploy-pages@v4
