name: Verify and publish Tasktap
on:
  pull_request:
  push:
    branches: [main, 'rebuild*']
  workflow_dispatch:

# No job reads a secret, so pull requests from forks run every check. Only the deployment
# asks for more than read access, and it never runs for a pull request.
permissions:
  contents: read

jobs:
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows from day one, so nothing Unix-only slips into the protocol.
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The core's terminals run in Microsoft's console when it lies beside the core, as in the
      # app; the test of a line typed as output ends has nothing to test without it.
      - name: Put Microsoft's console beside the core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --quiet
          ./scripts/conpty.ps1 -Target x86_64 -Into target/debug
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      # On Windows the whole suite runs as a person's Windows has it, and as the tower runs it
      # (scripts/winvm/run.ps1): in PowerShell, with no HOME, and with none of the Unix tools Git
      # brings (cp, mkfifo, sh) on the PATH. Git Bash lent the tests all three, and a test that
      # needed one passed here and failed there.
      - name: Test (Windows, without Git Bash's HOME and tools)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $unix = '\\Git\\(usr\\bin|bin|mingw64\\bin)\\?$'
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch $unix }) -join ';'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { $env:PATH += ";$env:ProgramFiles\Git\cmd" }
          $lent = @('cp', 'mkfifo', 'sh') | Where-Object { Get-Command $_ -CommandType Application -ErrorAction SilentlyContinue }
          if ($lent) { throw "Unix tools still on the PATH: $($lent -join ', ')" }
          git --version
          cargo test --workspace --no-fail-fast
      # The Windows install line (site/install.ps1) in Windows PowerShell 5.1 and PowerShell 7, with a stand-in
      # installer and a stand-in running app; nothing is installed for the runner's account.
      - name: The Windows install line (stand-ins only)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: ./scripts/install-check.ps1

  interface:
    name: Interface (types, tests, build, pages)
    # On a Mac: the page checks measure text in the system's face, which is the app's on a Mac (SF) and on
    # Windows (Segoe UI) and neither on Linux. There system-ui is DejaVu Sans, and Chromium on Linux lends a
    # pixel of its ascent to its descent at 2x (subpixel positioning), so each label stood 1.5 to 2 px off the
    # mark that leads it: 37 things out of line on the Linux runner that are in line in the app.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: No whitespace errors in this change
        run: git diff --check HEAD^ HEAD
      # With stand-ins only: nothing is installed or started. Its accepting path needs a notarised image and is tried by
      # a signed run of release.yml.
      - name: The Mac's install line refuses what it must
        run: scripts/install-check.sh
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: ui
      - name: Types and tests
        run: npm run check
        working-directory: ui
      - name: Build the pages
        run: npm run build
        working-directory: ui
      # Chromium and WebKit, the Mac's engine, in which a click on a button gives it no keyboard: three defects in a
      # row were of that kind. Where CI is set a check that cannot start WebKit fails (composer-check,
      # settings-rows-check, late-cleanup-check); at a desk without it, it says so in a NOTE.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the headless browsers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium webkit
      - name: The page scripts parse
        run: for file in scripts/*.cjs; do node --check "$file"; done
      # Each check a step of its own, so that what each takes is in the run (scripts/ci.sh --steps).
      - name: Every list keeps its columns
        run: node scripts/align-check.cjs
      - name: The notch and the workspace render in every state without a page error
        run: |
          node scripts/motion-pages.cjs "$RUNNER_TEMP/pages/states"
          node scripts/instrument-shots.cjs "$RUNNER_TEMP/pages/instrument" 1
      # Run by workers, and until now nowhere in the workflow. (The smoke runs words-check, composer-check, type-check,
      # links-check, frame-check, voice-check and speech-check in the host job.)
      - name: Settings' rows by the pointer and the keyboard, in Chromium and WebKit
        run: node scripts/settings-rows-check.cjs "$RUNNER_TEMP/pages/rows"
      # What a part of a page undoes when it goes, undone that moment, never after the next frame (the hold-to-talk
      # recorder's defect was of that kind).
      - name: What goes with a part of a page goes at once, in Chromium and WebKit
        run: node scripts/late-cleanup-check.cjs
      # The window can be up before the core is (a first start held up by a virus scan): the page says "Starting…",
      # claims nothing it does not know, and keeps a task started meanwhile for the core.
      - name: While the core starts, the page claims nothing and keeps what is started
        run: node scripts/starting-check.cjs
      - name: Settings › Projects at every size of window and text
        run: node scripts/projects-shots.cjs "$RUNNER_TEMP/pages/projects" --check --sizes
      - name: Placing by a model, its sheet and its order
        run: node scripts/placing-check.cjs "$RUNNER_TEMP/pages/placing"
      - name: The live target while a task is written, its line, its calm, and what Return takes
        run: node scripts/target-check.cjs "$RUNNER_TEMP/pages/target"
      - name: A workspace in a window of its own, its row and its page
        run: node scripts/windows-check.cjs "$RUNNER_TEMP/pages/windows"
      - name: Closing a terminal asks only when something runs
        run: node scripts/closing-check.cjs --pictures "$RUNNER_TEMP/pages/closing"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-pages
          path: ${{ runner.temp }}/pages
          if-no-files-found: ignore

  host:
    name: Host on macOS (lint, release build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
        working-directory: host
      - name: Build the app (pages, core, host)
        run: host/scripts/build.sh
      - name: Lint
        run: cargo clippy -- -D warnings
        working-directory: host
      - name: Notch geometry
        run: cargo test
        working-directory: host
      - name: The app carries its core and its identity, and seals with every program in it signed
        run: |
          app="host/target/release/bundle/macos/Tasktap.app"
          test -x "$app/Contents/MacOS/tasktap-app"
          codesign --verify --strict "$app/Contents/MacOS/tasktap"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.harzerheribert.tasktap
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = "Tasktap"
          # Sealed ad hoc as a release seals it with the Developer ID (release.yml): the hardened runtime and each
          # program's own entitlements, no program left unsigned.
          host/scripts/sign-mac.sh "$app"

  # The smoke in a job of its own: with the release build, the lint and the host's tests before it, one job took 2611
  # of its 2700 s (run 44698235184), and the smoke builds what it runs itself.
  smoke:
    name: Smoke on macOS (the real app on the fixture agent)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install the pages' tools
        run: npm ci --no-audit --no-fund
        working-directory: ui
      # WebKit too: the smoke's composer-check tries the Mac's engine, and fails where CI is set without it.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the headless browsers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install chromium webkit
      - name: Smoke (the real app on the fixture agent, passive, in a temporary data folder)
        # The smoke run expects the Mac's default shell, zsh: it looks for a terminal named after it
        # and for a bracketed paste, which the system's bash does not do. The runner's account
        # uses bash, so the shell is named here, with an empty start file to keep it quiet.
        # ALIGNED=elsewhere: the Interface job runs the lists' check on this commit on the same Mac image; here
        # it took 7 of the smoke's 33 minutes, which with the build ran the job into its 45 (run 44679720318).
        run: |
          touch "$HOME/.zshrc"
          SHELL=/bin/zsh SHOTS="$RUNNER_TEMP/smoke" ALIGNED=elsewhere host/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: host-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # The public site describes this app. What it takes from the app (site/app) is made on a Mac by
  # scripts/render-site.cjs and committed; here it is assembled and checked on every run, and
  # published from main only.
  site:
    name: Public site
    # Not ubuntu-latest: that is Ubuntu 26.04 now, for which Playwright 1.60 has no browser.
    runs-on: ubuntu-24.04
    # The browsers' system packages took ten minutes to install on a slow day (2026-11-23), and the story check
    # was cut off at fifteen: twice the usual seven minutes is not enough room.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: The site's scripts parse
        run: for file in site/*.js site/src/*.js site/app/stage.js; do node --check "$file"; done
      - name: Build the site
        run: python3 scripts/build-site.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise the built site
        run: |
          export TASKTAP_SCREENSHOTS="$RUNNER_TEMP/site-shots"
          mkdir -p "$TASKTAP_SCREENSHOTS"
          node scripts/verify-pages.cjs
      - name: Scroll the product page's story
        run: TASKTAP_SCREENSHOTS="$RUNNER_TEMP/site-shots" node scripts/story-check.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-checks
          path: ${{ runner.temp }}/site-shots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/pages

  # The rule that guards main asks for two checks by the names the first Tasktap's workflow gave its jobs. These two
  # stand for today's jobs under those names. Each passes only when every job it stands for passed: a job that is
  # skipped because one it needs failed would count as passed with the rule, so each says so itself.
  rule-interface:
    name: "UI, behavior and documentation"
    needs: [interface, site, core]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Interface, Public site and Core passed
        env:
          RESULTS: ${{ needs.interface.result }} ${{ needs.site.result }} ${{ needs.core.result }}
        run: '[ "$RESULTS" = "success success success" ] || { echo "::error::not all passed: $RESULTS"; exit 1; }'

  rule-host:
    name: "macOS build and notch geometry"
    needs: [host, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Host and Smoke passed
        env:
          RESULTS: ${{ needs.host.result }} ${{ needs.smoke.result }}
        run: '[ "$RESULTS" = "success success" ] || { echo "::error::not all passed: $RESULTS"; exit 1; }'

  # Only when every check passed, the install lines' included (interface, core); from main, on a push to it or by hand
  # (Run workflow on main). The order at a release: publish the release, then merge into main.
  deploy:
    name: Publish GitHub Pages
    needs: [site, interface, core]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      published: ${{ steps.ready.outputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: tasktap-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The site offers the newest release's files by fixed names, which only a release made by release.yml has, and
      # the Mac's line, which installs nothing while it names no team; and its pictures of the app are made from the app
      # as it is (scripts/render-site.cjs, run on a Mac). Until all three hold, the site that is up stays up and this job
      # says why, in green; it publishes on the next push to main, or when run by hand. A range of one byte, since a
      # signed asset address may refuse HEAD.
      - name: The newest release has what the site offers, the Mac line names Tasktap's team, and the pictures are fresh
        id: ready
        run: |
          why=""
          grep -Eq '^TEAM_ID="[A-Z0-9]{10}"$' site/install.sh || why="TEAM_ID in site/install.sh is empty, so the Mac line would install nothing"
          node scripts/verify-pages.cjs --fresh --stamp || why="${why:+$why, and }the site's pictures of the app are older than the app (run scripts/render-site.cjs on a Mac and commit them)"
          missing=""
          for name in Tasktap_aarch64.dmg Tasktap_x64-setup.exe SHA256SUMS; do
            curl -fsL --retry 3 --proto '=https' --range 0-0 -o /dev/null "https://github.com/HarzerHeribert/Tasktap/releases/latest/download/$name" || missing="$missing $name"
          done
          [ -z "$missing" ] || why="${why:+$why, and }the newest published release has no$missing"
          if [ -n "$why" ]; then
            echo "::notice::The site was not published, and the one that is up stays up, because $why."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy checked Pages artifact
        if: steps.ready.outputs.publish == 'true'
        id: publish
        uses: actions/deploy-pages@v4

  # Once the site is published, the Mac's line as a person runs it (the shipped script, nothing substituted) on the newest
  # published release, into a folder of the run's own, the app not started: the only place its downloads and Apple's
  # real verdicts are tried end to end. Red when it cannot install. The Windows line is not tried here: GitHub's Windows
  # runners are elevated, where it refuses by design; a Windows machine with an ordinary account tries it
  # (scripts/install-check.ps1 says what it runs).
  mac-line:
    name: The Mac line installs the newest release
    needs: [deploy]
    if: needs.deploy.outputs.published == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: The Mac line, into a folder of this run's
        run: |
          to="$RUNNER_TEMP/apps"
          TASKTAP_INSTALL_TO="$to" TASKTAP_INSTALL_NO_START=1 sh < site/install.sh
          codesign --verify --deep --strict --verbose=2 "$to/Tasktap.app"
