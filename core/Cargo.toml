[workspace]
resolver = "3"
members = ["proto"]

[package]
name = "tasktap-core"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "tasktap"
path = "src/main.rs"

[features]
# Test hooks compiled into the binary (design §13). Only the tests turn it on,
# through the dev-dependency on this crate below; a release build never has it.
fixtures = []

[dependencies]
tasktap-proto = { path = "proto" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = "1"
serde_json = "1"
sha2 = "0.11"
# `macros` is for `select!` only; it adds nothing at run time.
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "sync", "macros"] }

# Terminals on Mac and Linux (design §9). On Windows the core makes the
# pseudo-console and its child itself (`sys.rs`), so that the child is in its
# job from the start and a batch file's arguments are written for the command
# prompt.
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
# The pipe's peer check: std and tokio cannot name the user behind a process,
# nor end a pipe that has a write in flight. The same version tokio already uses.
# Job objects end a terminal's whole process tree; the console size is for
# the test role only. Credentials are the keys of web providers (design §8).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tasktap-core = { path = ".", features = ["fixtures"] }

# A panic anywhere must end the core, never just the task it happened in:
# the next start's recovery pass then closes what was under way.
[profile.dev]
panic = "abort"

# Without its symbol table the binary is 1.3 MB smaller (design §10). A
# panic still names its file and line, which is all the core ever printed.
# One unit of code generation, optimised across crates as a whole, makes it
# 0.53 MB smaller again (5.94 to 5.41 MB), and no slower by
# `scripts/measure.sh` (one unit alone was, at streaming); it costs only the
# release build's time.
[profile.release]
panic = "abort"
strip = true
codegen-units = 1
lto = "fat"
