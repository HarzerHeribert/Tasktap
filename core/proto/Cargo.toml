[package]
name = "tasktap-proto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `v4` mints secrets; it needs nothing `v7` does not already pull in.
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# Build only: generates protocol.ts in a unit test, never part of the core binary.
ts-rs = { version = "11", features = ["no-serde-warnings"] }
