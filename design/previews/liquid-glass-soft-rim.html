<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasktap — soft glass study</title><style>:root{color-scheme:light dark}body{margin:0;padding:32px 20px;background:light-dark(#eceee9,#151a18)}#tasktap-glass-study{max-width:1050px;margin:auto}button:focus-visible{outline:2px solid #638eaa;outline-offset:4px}[hidden]{display:none!important}</style><div id="tasktap-glass-study" class="tt-study" aria-label="Tasktap glass placements">

<style>

#tasktap-glass-study .tt-title i{width:10px;height:10px;border-radius:50%;background:#ef6c61}#tasktap-glass-study .tt-title i:nth-child(2){background:#e8bd52}#tasktap-glass-study .tt-title i:nth-child(3){background:#65bb62}#tasktap-glass-study .tt-title span{margin:auto;font-size:12px;color:var(--muted);padding-right:47px}
#tasktap-glass-study .tt-layout{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:540px}

#tasktap-glass-study .tt-brand{color:#f8faf7;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px;padding:0 10px}

#tasktap-glass-study .tt-side small{font:10px/1.4 ui-monospace,monospace;letter-spacing:2px;padding:0 10px;color:#a7b5ae}

#tasktap-glass-study .tt-nav div{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13px}

<script>

const root=document.getElementById('tasktap-glass-study');
const list=`<div><h2>In progress</h2><div class="tt-list"><div class="tt-row"><span class="tt-avatar">✳</span><div><strong>Lighting pass</strong><small>Reactive Wallpapers · Claude</small></div><span class="tt-state">Running</span></div><div class="tt-row"><span class="tt-avatar">⌘</span><div><strong>Material study</strong><small>Glasshouse · Codex</small></div><span class="tt-state">Running</span></div><div class="tt-row"><span class="tt-avatar">↗</span><div><strong>Documentation indexing</strong><small>Folio · Gemini</small></div><span class="tt-state">Running</span></div></div></div>`;
root.querySelectorAll('.tt-window').forEach(w=>{
 const capture=w.dataset.layout==='capture';

uniform sampler2D artwork;uniform vec2 size;uniform float time;uniform float thickness;uniform vec2 pointer;uniform float capture;

void main(){vec2 px=vec2(gl_FragCoord.x,size.y-gl_FragCoord.y);vec2 halfSize=size*.5-vec2(7.);float radius=min(size.y*.43,64.);vec2 q=px-size*.5;vec2 k=abs(q)-halfSize+radius;float d=length(max(k,0.))+min(max(k.x,k.y),0.)-radius;float inside=1.-smoothstep(-.75,.75,d);float wide=26.;vec2 shift=vec2(0.);if(d<0.&&-d<wide){vec2 n=vec2(0.,sign(q.y));if(k.x>0.&&k.y>0.)n=normalize(k)*sign(q);else if(k.x>k.y)n=vec2(sign(q.x),0.);float x=clamp(-d/wide,0.,1.);float m=1.-x;float rest=max(1.-m*m*m*m,.0001);float h=pow(rest,.25);float slope=m*m*m*pow(rest,-.75)*thickness/wide;float tilt=atan(slope);float bent=asin(sin(tilt)/1.5);shift=n*thickness*h*tan(tilt-bent)*inside;}
