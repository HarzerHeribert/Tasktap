[package]
name = "tasktap-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tasktap-next"
path = "src/main.rs"

[dependencies]
# The pages are always the built ones in ../ui/dist, embedded at compile time.
tauri = { version = "2.12", features = ["macos-private-api", "custom-protocol"] }
# Global shortcuts that work with no window focused (Carbon hot keys, no permission needed).
tauri-plugin-global-shortcut = "2"
# The frame types and codec the core speaks; the core's own client blocks and owns
# its socket, which does not fit a pass-through, so the transport is written here.
tasktap-proto = { path = "../core/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The mark in the notification area on Windows is read from the pictures in icons/tray (src/tray.rs). In the tree
# already through Tauri.
png = "0.18"

# The notch panel, the folder panel and the pasteboard are AppKit's (src/native.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# The mouse-moved monitors take a block; already in the tree through objc2-app-kit.
block2 = "0.6"

# The core's named pipe, read and written from two threads, its name and whose it is; the
# clipboard and the power state (src/windows.rs); the window's caption buttons, its colours and
# dark menus (src/chrome.rs); the tab's window and the icon in the notification area (src/edge.rs,
# src/tray.rs). Both are in the tree already through Tauri.
[target.'cfg(windows)'.dependencies]
sha2 = "0.11"
# The web view's own settings, for the browser's keys it must not act on (src/chrome.rs), and what it is held to
# for a preview's frame (src/windows.rs).
webview2-com = "0.39"
windows-core = "0.62"
# The system's folder dialog and a file to write a page's picture to (src/windows.rs): interfaces, which
# windows-sys does not have. In the tree already through Tauri.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
