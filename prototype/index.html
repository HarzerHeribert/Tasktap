<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Tasktap</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="voice-wave.css"><link rel="stylesheet" href="routing-activity.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="setup.css">

<body class="notch-first">

<div class="island" id="island"><button id="islandToggle" aria-expanded="false" aria-label="Toggle assistant notch" aria-controls="notch-home" aria-describedby="islandLabel"></button><span id="islandLabel" hidden></span></div>
<section hidden id="notch-home" aria-label="Tasktap notch"></section>
<div id="status-menu" hidden aria-label="Assistant menu"></div>

<div class="demo-strip"><span class="demo-dot"></span><span>Interaction prototype</span><button data-surface="controller">Codex Micro controls</button></div>
<div class="shell">
<aside id="sidebar"><div class="brand"><span class="brand-mark" aria-hidden="true"><img src="assets/resonator/miniature.jpg" alt=""></span><div><strong>Tasktap</strong></div></div>

<main id="main" tabindex="-1"></main></div></div>
<dialog id="modal"></dialog><dialog id="notch" aria-label="Notch decision"></dialog><div class="toast" id="toast" role="status"></div>
