[package]
name = "tauri-notch-trial"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
base64 = "0.22"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
